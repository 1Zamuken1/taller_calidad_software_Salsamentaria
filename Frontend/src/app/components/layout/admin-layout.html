<!-- Header de Admin -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <div class="d-flex align-items-center">
      <button class="btn btn-dark toggle-sidebar me-3" (click)="toggleSidebar()">
        <i class="bi bi-list fs-4"></i>
      </button>
      <i class="bi bi-shield-check text-warning me-2" style="font-size: 1.5rem;"></i>
      <span class="navbar-brand mb-0 h5">Panel de Administración</span>
    </div>

    <div class="d-flex align-items-center">
      <span class="text-light me-3 d-none d-md-inline">
        <i class="bi bi-person-circle me-1"></i>
        <strong>{{ nombreAdmin }}</strong>
      </span>
      <button class="btn btn-outline-danger btn-sm" (click)="logout()">
        <i class="bi bi-box-arrow-right me-1"></i>
        <span class="d-none d-md-inline">Salir</span>
      </button>
    </div>
  </div>
</nav>

<!-- Overlay para móvil -->
<div class="sidebar-overlay" 
     [class.show]="!sidebarCollapsed" 
     (click)="toggleSidebar()"
     *ngIf="!sidebarCollapsed"></div>

<!-- Layout wrapper -->
<div class="admin-wrapper">
  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <h5 *ngIf="!sidebarCollapsed">
        <i class="bi bi-grid-fill me-2"></i>
        Menú
      </h5>
      <i *ngIf="sidebarCollapsed" class="bi bi-grid-fill fs-4"></i>
    </div>

    <nav class="sidebar-nav">
      <a *ngFor="let item of menuItems" 
         [routerLink]="item.path"
         class="nav-link"
         [class.active]="isActive(item.path)"
         routerLinkActive="active">
        <i class="bi" [ngClass]="item.icon"></i>
        <span *ngIf="!sidebarCollapsed">{{ item.label }}</span>
        <span *ngIf="item.badge && !sidebarCollapsed" 
              class="badge bg-danger rounded-pill">
          {{ item.badge }}
        </span>
      </a>
    </nav>

    <div class="sidebar-footer" *ngIf="!sidebarCollapsed">
      <div class="user-info">
        <i class="bi bi-person-circle"></i>
        <div class="user-details">
          <small class="d-block text-white-50">Administrador</small>
          <strong class="d-block">{{ nombreAdmin }}</strong>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content" [class.expanded]="sidebarCollapsed">
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
