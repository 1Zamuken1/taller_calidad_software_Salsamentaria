<div class="container py-5">
  <h2 class="text-center mb-5 fw-bold">🛒 Productos Disponibles</h2>

  <div class="row g-4 justify-content-center">
    <div *ngFor="let producto of productos" class="col-12 col-sm-6 col-md-4 col-lg-3">
      <div class="card border-0 shadow-sm h-100 product-card">
        <div class="ratio ratio-1x1 overflow-hidden rounded-top">
          <img 
            [src]="producto.imagen_url || 'https://via.placeholder.com/300x300?text=Sin+Imagen'" 
            class="card-img-top object-fit-cover transition-scale"
            alt="{{ producto.nombre }}">
        </div>

        <div class="card-body d-flex flex-column">
          <h5 class="card-title text-truncate">{{ producto.nombre }}</h5>
          <p class="card-text text-muted mb-3">
            <strong>Precio:</strong> ${{ producto.precio }}
          </p>

          <div class="mt-auto">
            <input 
              type="number" 
              min="0" 
              [(ngModel)]="producto.cantidad" 
              placeholder="Cantidad" 
              class="form-control form-control-sm mb-2 text-center">
            <button 
              class="btn btn-primary w-100 fw-semibold btn-add"
              (click)="agregar(producto)">
              Agregar al carrito
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
