<div class="login-container d-flex align-items-center justify-content-center">
  <div class="login-card p-4 shadow">
    <h2 class="text-center mb-4 text-primary fw-bold">Bienvenido</h2>
    <p class="text-center text-muted mb-4">Inicia sesión para continuar</p>

    <!-- Mensaje de error -->
    <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input
          type="email"
          class="form-control"
          id="email"
          required
          [(ngModel)]="email"
          name="email"
          [disabled]="loading"
          placeholder="tucorreo@ejemplo.com"
        />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input
          type="password"
          class="form-control"
          id="password"
          required
          [(ngModel)]="password"
          name="password"
          [disabled]="loading"
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100 py-2"
        [disabled]="loading || !loginForm.valid"
      >
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>

      <div class="mt-3 text-center">
        <a routerLink="/register" class="text-decoration-none text-secondary">
          ¿No tienes cuenta? <span class="text-primary fw-semibold">Regístrate</span>
        </a>
      </div>
    </form>
  </div>
</div>
